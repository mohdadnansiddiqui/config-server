server:
  port: 8086

spring:
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_payment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never



springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

services:
  order:
    url: http://localhost:8085
