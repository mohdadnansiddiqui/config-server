
server:
  port: 9000

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_category}
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  

app:
  cors:
    allowed-origins: http://localhost:4200

  
springdoc:
  swagger-ui:
    path: /swagger-ui.html

